[project]
name = "aluci-ai-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "dacite>=1.9.2",
    "fire>=0.7.1",
    "hydra-core>=1.3.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "pre-commit>=4.5.1",
    "pydantic>=2.12.5",
    "ruamel-yaml>=0.19.1",
    "tensorboard>=2.20.0",
    "transformers>=5.4.0",
]

[project.optional-dependencies]
amd = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "triton-rocm>=3.6.0",
]
marimo = [
    "marimo>=0.22.0",
]

[dependency-groups]
torch = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
default-groups = ["torch"]
conflicts = [
    [
        { group = "torch" },
        { extra = "amd" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-amd", extra = "amd" },
]
torchvision = [
    { index = "pytorch-amd", extra = "amd" },
]
triton-rocm = [
    { index = "pytorch-amd", extra = "amd" },
]

[[tool.uv.index]]
name = "pytorch-amd"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true
